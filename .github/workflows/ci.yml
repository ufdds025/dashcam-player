name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libxcb-xinerama0 libgl1 libegl1 libopengl0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-render-util0

      - name: Install Python dependencies (core only)
        run: |
          pip install --upgrade pip
          pip install -r dashcam_player/requirements-core.txt
          pip install pytest ruff mypy

      - name: Lint (ruff)
        run: ruff check dashcam_player/

      - name: Type check (mypy)
        run: mypy dashcam_player/

      - name: Test (pytest)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download FFmpeg
        run: |
          curl.exe -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extract
          $bin = (Get-ChildItem -Path ffmpeg_extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          "FFMPEG_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        run: pip install -r dashcam_player/requirements.txt pyinstaller

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --onefile --name DashcamPlayer --console `
            --add-data "$env:FFMPEG_BIN\ffmpeg.exe;." `
            --add-data "$env:FFMPEG_BIN\ffprobe.exe;." `
            --exclude-module pytest `
            dashcam_player\main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: DashcamPlayer-windows-x64
          path: dist/DashcamPlayer.exe

      - name: Attach EXE to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DashcamPlayer.exe
